{% assign is_de = false %}
{% if page.url contains "/de/" %}{% assign is_de = true %}{% endif %}

<header>
  <a class="site-name" href="{% if is_de %}{{ '/de/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">Niclas Knecht</a>

  <nav class="lang-switch" aria-label="Language">
    {% if is_de %}
      <a href="{{ page.url | remove_first: '/de' | relative_url }}" lang="en" hreflang="en">EN</a>
      <span aria-hidden="true">/</span>
      <span aria-current="true">DE</span>
    {% else %}
      <span aria-current="true">EN</span>
      <span aria-hidden="true">/</span>
      <a href="{{ page.url | prepend: '/de' | relative_url }}" lang="de" hreflang="de">DE</a>
    {% endif %}
  </nav>
</header>
