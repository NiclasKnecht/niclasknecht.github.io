<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nic Knecht</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#9a9a9a; }
  }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg);
         max-width: 34rem; margin: 6rem auto; padding: 0 1.25rem; line-height: 1.6; }
  nav { text-align: right; font-size: .9rem; margin-bottom: 3rem; }
  nav button { background: none; border: 0; color: var(--muted); cursor: pointer;
               font: inherit; padding: 0 .25rem; }
  html[data-lang="en"] button[data-set="en"],
  html[data-lang="de"] button[data-set="de"] { color: var(--fg); text-decoration: underline; }
  h1 { font-weight: 600; font-size: 1.6rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 2rem; }
  a { color: var(--fg); }
  [lang] { display: none; }
  html[data-lang="en"] [lang="en"], html[data-lang="de"] [lang="de"] { display: block; }
  span[lang] { display: none; }
  html[data-lang="en"] span[lang="en"], html[data-lang="de"] span[lang="de"] { display: inline; }
</style>
</head>
<body>
<nav>
  <button data-set="en">EN</button>|<button data-set="de">DE</button>
</nav>

<h1>Nic Knecht</h1>
<p class="sub" lang="en">Economist, Hamburg</p>
<p class="sub" lang="de">Ökonom, Hamburg</p>

<p lang="en">Short intro sentence here.</p>
<p lang="de">Kurzer Einleitungssatz hier.</p>

<p>
  <a href="cv-en.pdf" lang="en" style="display:inline">CV (PDF)</a>
  <a href="cv-de.pdf" lang="de" style="display:inline">Lebenslauf (PDF)</a>
  &nbsp;·&nbsp;
  <a href="mailto:you@example.com">Email</a>
  &nbsp;·&nbsp;
  <a href="https://www.linkedin.com/in/your-profile">LinkedIn</a>
</p>

<script>
  const root = document.documentElement;
  const saved = localStorage.getItem("lang");
  const initial = saved || (navigator.language.startsWith("de") ? "de" : "en");
  const set = l => { root.dataset.lang = l; root.lang = l; localStorage.setItem("lang", l); };
  set(initial);
  document.querySelectorAll("button[data-set]").forEach(b =>
    b.addEventListener("click", () => set(b.dataset.set)));
</script>
</body>
</html>
